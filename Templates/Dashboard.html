<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypto Messaging - Secure</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body class="gradient-bg chat-page">
<div class="container full-height-chatbox">

    {% if error %}
    <div class="alert alert-danger mt-2">
        <pre>{{ error | e }}</pre>
    </div>
    {% endif %}

    <div class="sidebar">
        <h5 class="sidebar-title text-center text-light mb-4">Online</h5>

        <ul class="contacts-list">
            {% for user in online_users %}
                <li><a href="#">{{ user.username | e }}</a></li>
            {% endfor %}
        </ul>

        <div class="mt-auto">
            <a href="/logout" class="logout-link">Logout</a>
        </div>
    </div>

    <div class="chat-area">
        <h2 class="text-center text-light mb-4">Encrypto Chat</h2>
        <h5 class="card-title text-center mb-4 display-6 fw-normal">Chat Room</h5>

        <form action="/dashboard" method="POST" class="mb-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="message-bar">
                <label for="receiver">Recipient's Username</label>
                <input type="text" id="receiver" name="receiver" placeholder="Enter recipient's username">

                <label for="content">Your Message</label>
                <textarea id="content" name="content" placeholder="Type message..."></textarea>

                <button type="submit">Send</button>
            </div>
        </form>

        <!-- Messages container -->
        <div id="chat-window" class="chat-window"></div>

    </div>
</div>

<script>
async function refreshMessages() {
    const cw = document.getElementById("chat-window");
    let response = await fetch("/get_messages");
    let html = await response.text();

    // innerHTML → we create a safe DOM container
    // and treat all content as text.
    const temp = document.createElement("div");
    temp.innerHTML = html;

    // Escape ALL dangerous content 
    temp.querySelectorAll("*").forEach(el => {
        if (el.nodeName === "DIV" || el.nodeName === "SMALL" || el.nodeName === "STRONG") {
            // allowed tags → but escape text inside
            el.textContent = el.textContent;
        } else {
            // remove all non-approved elements (img, svg, script, etc.)
            el.remove();
        }
    });

    cw.innerHTML = "";
    cw.appendChild(temp);
}

refreshMessages();
setInterval(refreshMessages, 1000);
</script>

</body>
</html>
