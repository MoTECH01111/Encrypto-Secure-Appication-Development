<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypto Messaging- Insecure</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="gradient-bg chat-page">

    <div class="container full-height-chatbox">
        <div class="sidebar">
            <h5 class="sidebar-title text-center text-light mb-4">Online</h5>

            <ul class="contacts-list">
                <li><a href="#">{{ username }}</a></li>
            </ul>

            <!-- Logout Link -->
            <div class="mt-auto">
                <a href="/logout" class="logout-link">Logout</a>
            </div>
        </div>
        <div class="chat-area">
            <h2 class="text-center text-light mb-4">Encrypto chat</h2>
            <h5 class="card-title text-center mb-4 custom-color2 display-6 fw-normal">Chat Room</h5>
            {% if error %}
                <p style="color:red;">{{ error|safe }}</p>
            {% endif %}
            <form action="/dashboard" method="POST" class="mb-4">
                <label class="form-label text-light">Recipient's Username</label>
                <input type="text" name="receiver" class="form-control"
                       placeholder="Enter recipient's username">

                <label class="form-label text-light mt-3">Your Message</label>
                <textarea name="content" class="form-control"
                          placeholder="Type message..."></textarea>

                <button type="submit" class="btn btn-primary mt-3">Send</button>
            </form>
            <div id="chat-window" class="chat-window">

                {% if inbox %}
                    {% for msg in inbox %}
                        <div class="message">
                        
                            <strong>{{ msg['sender'] }}:</strong>
                            <span style="white-space: pre-wrap;">{{ msg['content']|safe }}</span>
                            <br>
                            <small class="timestamp">{{ msg['created_at'] }}</small>
                        </div>
                    {% endfor %}
                {% else %}
                    <p class="text-light">No messages yet.</p>
                {% endif %}
            </div>

        </div> 

    </div> 
</body>
</html>
